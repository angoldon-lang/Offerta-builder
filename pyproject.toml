[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offerta-builder"
version = "0.1.0"
description = "Offer Builder controllato: importa BOM distributori, applica regole commerciali deterministiche e genera l'offerta DOCX/PDF su template."
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "docxtpl>=0.16",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
offerta = "offerta_builder.cli:main"

[tool.setuptools.packages.find]
include = ["offerta_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
